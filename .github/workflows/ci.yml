name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 빌드 시 번들에 들어가는 공개 값만. 미설정이어도 빌드는 통과(앱이 정적 폴백).
      # SUPABASE_SERVICE_ROLE_KEY 등 서버 시크릿은 CI에 넣지 않는다.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_ADMIN_BASE_PATH: ${{ secrets.NEXT_PUBLIC_ADMIN_BASE_PATH }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 배포물(운영 의존성) 취약점만 차단. eslint 등 개발 도구 쪽은 Dependabot PR로 따라감
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run build
      # 스모크 E2E — Supabase 서버 시크릿 없이 정적 폴백으로 실행(상세 진입·로그인 테스트는 skip)
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
